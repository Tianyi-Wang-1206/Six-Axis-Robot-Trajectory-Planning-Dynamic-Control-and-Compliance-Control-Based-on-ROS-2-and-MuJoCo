# Compliance and Drag Teaching Controller Configuration
# Loaded alongside ros2_controllers.yaml for ctc_controller.

ctc_controller:
  ros__parameters:
    # Real-time Pinocchio payload inertia update and linear static-moment smoothing.
    payload:
      filter_time_constant: 0.15                            # s; exponential smoothing time constant for (m, m*c)
      nominal_gyration_radius: 0.025                        # m; point-payload effective gyration radius for local wrist inertia

    # Per-mode gains and limits share the Cartesian regularization metric.
    compliance:
      characteristic_length: 0.15  # m; translational/rotational regularization metric
      # 1. Dedicated Joint-Space Impedance Mode Parameters (MODE_JOINT_IMPEDANCE)
      joint_impedance:
        max_joint_velocity: 3.0
        hard_limit_tolerance: 0.01
        saturation_timeout: 1.0
        entry_max_speed: 0.03
        filter_time_constant: 0.15
        soft_limit_margin: 0.15
        soft_limit_stiffness: 80.0
        soft_limit_damping: 5.0
        torque_slew_rate: 120.0
        transition_duration: 0.25

      # 2. Dedicated Interactive Cartesian-Space Impedance Parameters (MODE_CARTESIAN_IMPEDANCE)
      cartesian_impedance:
        max_joint_velocity: 3.0
        hard_limit_tolerance: 0.01
        saturation_timeout: 1.0
        entry_max_speed: 0.03
        filter_time_constant: 0.15
        min_translation_damping: 2.0                        # N s/m floor when translation_stiffness -> 0
        min_rotation_damping: 0.15                          # Nm s/rad floor when rotation_stiffness -> 0
        min_effective_mass: 0.30                            # kg; operational-space translational mass lower clamp
        max_effective_mass: 15.0                            # kg; operational-space translational mass upper clamp
        min_effective_inertia: 0.005                        # kg m^2; operational-space rotational inertia lower clamp
        max_effective_inertia: 0.60                         # kg m^2; operational-space rotational inertia upper clamp
        operational_damping_lambda: 0.04                    # DLS regularization for operational inertia inversion
        soft_limit_margin: 0.15
        soft_limit_stiffness: 80.0
        soft_limit_damping: 5.0
        torque_slew_rate: 120.0
        transition_duration: 0.25

      # 3. Dedicated diag(M)-Normalized Drag Teaching Parameters (MODE_TEACH)
      teach:
        max_joint_velocity: 3.0
        hard_limit_tolerance: 0.01
        saturation_timeout: 1.0
        entry_max_speed: 0.03
        filter_time_constant: 0.15
        soft_limit_margin: 0.15
        soft_limit_stiffness: 80.0
        soft_limit_damping: 5.0
        torque_slew_rate: 120.0
        transition_duration: 0.25
        armature_weight: 0.04                               # weight on rotor armature in M_teach_i = M_link_ii(q) + beta * I_arm_i
        min_joint_damping: [0.15, 0.15, 0.10, 0.04, 0.03, 0.015]  # Nm s/rad per-joint floor
        max_joint_damping: [15.0, 15.0, 10.0, 4.0, 3.0, 1.5]      # Nm s/rad per-joint ceiling
        # diag(M)-normalized velocity decay rates [1/s] for sensitivity levels 1 (firm) through 5 (light):
        # d_i(q) = clamp(lambda_teach(sensitivity) * M_teach_i(q), min_joint_damping[i], max_joint_damping[i]).
        damping_levels: [22.0, 17.5, 13.5, 11.5, 9.5]

    # 4. Dedicated Time-Varying Cartesian Impedance Trajectory Parameters (MODE_CARTESIAN_IMPEDANCE_TRAJECTORY)
    impedance_execution:
      max_translation_deviation: 0.12     # m; max allowed TCP position deflection under external force
      max_rotation_deviation: 0.60        # rad; max allowed TCP orientation deflection under external force
      max_joint_deviation: 0.80           # rad; max allowed single-joint deflection from reference q_d(t)
      max_joint_velocity: 3.0             # rad/s; exceeding this triggers E-STOP
      hard_limit_tolerance: 0.01          # rad; allowance past URDF joint limits before E-STOP
      saturation_timeout: 1.0             # s; continuous effort saturation before E-STOP
      dynamics_ff_scale: 1.0              # [0..1] powered tracking inertial + Coriolis feedforward scale
      friction_viscous_scale: 0.90        # [0..1] share of friction_v_nominal
      friction_coulomb_scale: 0.80        # [0..1] share of friction_c_nominal along dq_ref(t)
      friction_transition_speed: 0.025    # rad/s; tanh transition width (> quiet_speed)
      friction_quiet_speed: 0.008         # rad/s; C1 Hermite ramp threshold near ref stop
      filter_time_constant: 0.10          # s; gain/wrench exponential smoothing time constant
      min_translation_damping: 2.0        # N s/m floor when translation_stiffness -> 0
      min_rotation_damping: 0.15          # Nm s/rad floor when rotation_stiffness -> 0
      min_effective_mass: 0.30            # kg; operational-space translational mass lower clamp
      max_effective_mass: 15.0            # kg; operational-space translational mass upper clamp
      min_effective_inertia: 0.005        # kg m^2; operational-space rotational inertia lower clamp
      max_effective_inertia: 0.60         # kg m^2; operational-space rotational inertia upper clamp
      operational_damping_lambda: 0.04    # DLS regularization for operational inertia inversion
      soft_limit_margin: 0.15             # rad; soft joint-limit wall margin
      soft_limit_stiffness: 80.0          # Nm/rad; soft joint-limit wall stiffness
      soft_limit_damping: 5.0             # Nm s/rad; soft joint-limit wall damping
      torque_slew_rate: 150.0             # Nm/s; transition-only torque slew rate limit
      goal_translation_tolerance: 0.05    # m; endpoint compliant equilibrium position envelope
      goal_rotation_tolerance: 0.25       # rad; endpoint compliant equilibrium orientation envelope
      goal_velocity_tolerance: 0.015      # rad/s; endpoint stationary velocity requirement (kPlannerSettleSpeedRadPerSec)
      goal_settle_duration: 0.3           # s; continuous stationary settling duration at endpoint
      goal_time_tolerance: 5.0            # s; endpoint settling deadline allowance
      entry_max_speed: 0.03               # rad/s; max joint speed allowed when starting impedance trajectory (kControllerEntryMaxSpeedRadPerSec)
      entry_position_tolerance: 0.15      # rad; max initial joint offset |q_d(0) - q(0)| allowed on entry
