# Compliance and Drag Teaching Controller Configuration
# Loaded alongside ros2_controllers.yaml for ctc_controller.

ctc_controller:
  ros__parameters:
    # Sensorless Generalized Momentum Observer (GMO) running continuously at 1 kHz.
    gmo:
      enabled: true
      observer_gains: [25.0, 25.0, 25.0, 30.0, 30.0, 30.0]  # rad/s per joint (1st-order LPF cutoff)
      jacobian_damping: 0.04                                # DLS regularization near wrist singularities
      friction_transition_speed: 0.03                       # rad/s; nominal Coulomb tanh smoothing for observer
      contact_force_threshold: 2.5                          # N; Cartesian wrench magnitude to flag contact

    compliance:
      # Safety limits active during all three compliance modes
      # (JOINT_IMPEDANCE, CARTESIAN_IMPEDANCE, and TEACH).
      max_joint_velocity: 3.0         # rad/s; exceeding this triggers E-STOP
      hard_limit_tolerance: 0.01      # rad; numerical allowance past URDF limits before E-STOP
      saturation_timeout: 1.0         # s; continuous effort saturation before E-STOP
      entry_max_speed: 0.01           # rad/s; max joint speed allowed when entering compliance
      max_external_joint_torque: [35.0, 35.0, 24.0, 20.0, 20.0, 12.0]  # Nm; GMO overload limit
      external_torque_timeout: 0.25   # s; continuous GMO overload duration before E-STOP

      # Passive velocity-based friction feedforward for JOINT_IMPEDANCE & CARTESIAN_IMPEDANCE
      # (Coulomb share stays 0.0 by default to prevent limit cycles inside virtual spring wells)
      friction_viscous_scale: 0.85    # [0..1) share of friction_v_nominal
      friction_coulomb_scale: 0.0     # [0..1) optional Coulomb share (keep 0 unless D is high)
      friction_transition_speed: 0.06 # rad/s; tanh transition width
      friction_quiet_speed: 0.08      # rad/s; C1 Hermite ramp threshold near rest

      # Gain smoothing and Cartesian null-space damping
      filter_time_constant: 0.15      # s; exponential smoothing time constant for mode gains
      cartesian_null_damping: 0.15    # Nm s/rad; joint-space damping in Cartesian impedance

      # Soft joint-limit wall inside mechanical travel limits
      soft_limit_margin: 0.15         # rad; distance inward from joint limits where wall starts
      soft_limit_stiffness: 80.0      # Nm/rad; soft wall spring gain
      soft_limit_damping: 5.0         # Nm s/rad; one-sided soft wall damping

      # Output torque rate limiting during compliance modes
      torque_slew_rate: 100.0         # Nm/s; maximum commanded torque rate of change

      # Drag teaching sensitivity profiles for levels 1 (firm) through 5 (light).
      # Intermediate sensitivity values are interpolated piecewise-linearly.
      teach:
        damping_levels: [4.0, 3.25, 2.5, 2.25, 2.0]                 # Nm s/rad
        assistance_levels: [0.35, 0.475, 0.60, 0.625, 0.65]         # bounded friction share [0..1]
        friction_transition_levels: [0.06, 0.06, 0.06, 0.06, 0.06]  # rad/s; tanh transition width
        quiet_speed_levels: [0.06, 0.06, 0.06, 0.06, 0.06]          # rad/s; Coulomb gate threshold

    # Isolated tolerances and safety envelope for time-varying Cartesian impedance
    # trajectory tracking (MODE_CARTESIAN_IMPEDANCE_TRAJECTORY).
    # Rigid trajectory execution.* parameters in ros2_controllers.yaml remain untouched.
    impedance_execution:
      max_translation_deviation: 0.12     # m; max allowed TCP position deflection under external force
      max_rotation_deviation: 0.60        # rad; max allowed TCP orientation deflection under external force
      max_joint_deviation: 0.80           # rad; max allowed single-joint deflection from reference q_d(t)
      max_joint_velocity: 3.0             # rad/s; exceeding this triggers E-STOP
      hard_limit_tolerance: 0.01          # rad; allowance past URDF joint limits before E-STOP
      saturation_timeout: 1.0             # s; continuous effort saturation before E-STOP
      max_external_joint_torque: [35.0, 35.0, 24.0, 20.0, 20.0, 12.0]  # Nm; GMO overload limit
      external_torque_timeout: 0.25       # s; continuous GMO overload duration before E-STOP
      # Passive viscous FF on measured dq_ + exogenous Coulomb FF on planned dq_ref(t)
      friction_viscous_scale: 0.90        # [0..1) share of friction_v_nominal
      friction_coulomb_scale: 0.80        # [0..1) share of friction_c_nominal along dq_ref(t)
      friction_transition_speed: 0.04     # rad/s; tanh transition width
      friction_quiet_speed: 0.01          # rad/s; C1 Hermite ramp threshold near ref stop
      goal_translation_tolerance: 0.05    # m; endpoint compliant equilibrium position envelope
      goal_rotation_tolerance: 0.25       # rad; endpoint compliant equilibrium orientation envelope
      goal_velocity_tolerance: 0.01       # rad/s; endpoint stationary velocity requirement
      goal_settle_duration: 0.3           # s; continuous stationary settling duration at endpoint
      goal_time_tolerance: 5.0            # s; endpoint settling deadline allowance
      entry_max_speed: 0.02               # rad/s; max joint speed allowed when starting impedance trajectory
      entry_position_tolerance: 0.15      # rad; max initial joint offset |q_d(0) - q(0)| allowed on entry
